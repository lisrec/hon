name: Tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: production-compat
            requirements: requirements-test.txt
          - lane: modern
            requirements: requirements-dev.txt
    name: Tests (${{ matrix.lane }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - run: python -m pip install -r "${{ matrix.requirements }}"
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m compileall -q custom_components/hon
      - run: git diff --check
